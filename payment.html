<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Secure Checkout - Tech Cafe</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://js.stripe.com/v3/"></script>

    <style>
        body { margin: 0; font-family: 'Inter', sans-serif; background: #0f0f13; color: #ffffff; }
        
        .checkout-container {
            max-width: 900px; margin: 60px auto; display: grid;
            grid-template-columns: 1.2fr 1fr; gap: 40px; padding: 0 20px;
        }

        @media (max-width: 768px) { .checkout-container { grid-template-columns: 1fr; } }

        .payment-panel {
            background: #1c1c24; padding: 40px; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .summary-panel {
            background: linear-gradient(145deg, #1a1a24 0%, #15151c 100%);
            padding: 40px; border-radius: 20px; border: 1px solid rgba(103, 114, 229, 0.2); /* Stripe Blurple Accent */
            height: fit-content;
        }

        h2 { margin-top: 0; font-size: 24px; font-weight: 600; margin-bottom: 25px; }
        
        /* --- Form & Stripe Elements Styles --- */
        .form-group { margin-bottom: 25px; }
        .form-group label { display: block; font-size: 13px; color: #a0a0a0; margin-bottom: 10px; font-weight: 500; }
        
        .stripe-input-container {
            padding: 16px; border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px; background: rgba(255,255,255,0.03); 
            transition: 0.3s;
        }
        
        .stripe-input-container.StripeElement--focus {
            border-color: #6772e5; /* Stripe Blurple */
            background: rgba(255,255,255,0.08); 
            box-shadow: 0 0 0 4px rgba(103, 114, 229, 0.1);
        }

        /* Error message styling */
        #card-errors {
            color: #ff4757; font-size: 13px; margin-top: 10px; font-weight: 500;
        }

        .total-amount { font-size: 42px; font-weight: 700; color: white; margin-bottom: 5px; }
        .secure-badge { display: flex; align-items: center; gap: 8px; color: #6772e5; font-size: 13px; font-weight: 600; margin-top: 20px; }

        .pay-btn {
            width: 100%; padding: 18px; border: none; border-radius: 12px;
            background: #6772e5; /* Stripe brand color */
            color: white; font-weight: 700; font-size: 16px; letter-spacing: 0.5px; cursor: pointer;
            transition: all 0.3s ease; margin-top: 10px; box-shadow: 0 4px 15px rgba(103, 114, 229, 0.3);
            text-transform: uppercase;
        }
        .pay-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(103, 114, 229, 0.5); background: #7795f8; }
        .pay-btn:disabled { background: #333; cursor: not-allowed; transform: none; box-shadow: none; color: #888; }
    </style>
    <script src="assets/demo.js"></script>
</head>
<body>

<script>
    // 1. Mobile Menu Toggle Logic
    function toggleMobileMenu() {
        const navMenu = document.getElementById("navLinksContainer");
        navMenu.classList.toggle("show-mobile-menu");
    }

    // 2. Smarter Active Link Logic
    document.addEventListener("DOMContentLoaded", function() {
        let currentPath = window.location.pathname.split('/').pop() || 'index.html';
        let currentHash = window.location.hash; 
        let navLinks = document.querySelectorAll("#navLinksContainer a");
        
        navLinks.forEach(link => {
            let linkHref = link.getAttribute("href");
            link.classList.remove("active");

            // Don't apply 'active' to the logout button
            if(link.classList.contains('logout-btn')) return;

            if (currentHash) {
                if (linkHref.includes(currentHash)) {
                    link.classList.add("active");
                }
            } else if (linkHref === currentPath) {
                link.classList.add("active");
            }
        });
    });
</script>
<style>
    @import url('https://fonts.googleapis.com/css?family=Amatic+SC:700');

    /* --- Tech Cafe Dark Background (FLEXBOX ADDED FOR CENTERING) --- */
    #global-loader {
        position: fixed;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        background-color: #0f0f13; /* EXACT match to your page background */
        z-index: 99999;
        overflow: hidden;
        transition: opacity 0.4s ease-in-out, visibility 0.4s ease-in-out;
        
        /* Flexbox guarantees perfect centering on all screen sizes */
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 5vh; /* Responsive space between text and pan */
    }

    #global-loader.hidden {
        opacity: 0;
        visibility: hidden;
    }

    /* --- Themed Typography --- */
    #global-loader h1 {
        margin: 0;
        text-align: center;
        font-family: 'Amatic SC', cursive;
        /* clamp() makes the font scale smoothly between mobile and desktop */
        font-size: clamp(32px, 6vw, 6vh); 
        color: #ffffff; 
        font-weight: 700;
        letter-spacing: 2px;
        opacity: .85;
        animation: pulse 2.5s linear infinite;
        text-shadow: 0 0 15px rgba(226, 55, 68, 0.4); 
    }

    /* --- The Cooking Pan --- */
    #cooking {
        position: relative;
        /* Changed from vh to vmin! This makes it responsive on portrait screens */
        width: 65vmin; 
        height: 65vmin;
        max-width: 500px; /* Caps the size on massive desktop screens */
        max-height: 500px;
        overflow: hidden;
    }

    #cooking .bubble {
        position: absolute;
        border-radius: 100%;
        box-shadow: 0 0 .25vh rgba(255, 107, 119, 0.8);
        opacity: 0;
    }

    /* Recalculated Bubble Colors & Sizes (vh -> vmin) */
    #cooking .bubble:nth-child(1) {
        margin-top: 2.5vmin; left: 58%; width: 2.5vmin; height: 2.5vmin;
        background-color: #ff6b77; 
        animation: bubble 2s cubic-bezier(.53, .16, .39, .96) infinite;
    }
    #cooking .bubble:nth-child(2) {
        margin-top: 3vmin; left: 52%; width: 2vmin; height: 2vmin;
        background-color: #ff4f5e; 
        animation: bubble 2s ease-in-out .35s infinite;
    }
    #cooking .bubble:nth-child(3) {
        margin-top: 1.8vmin; left: 50%; width: 1.5vmin; height: 1.5vmin;
        background-color: #E23744; 
        animation: bubble 1.5s cubic-bezier(.53, .16, .39, .96) .55s infinite;
    }
    #cooking .bubble:nth-child(4) {
        margin-top: 2.7vmin; left: 56%; width: 1.2vmin; height: 1.2vmin;
        background-color: #c42835; 
        animation: bubble 1.8s cubic-bezier(.53, .16, .39, .96) .9s infinite;
    }
    #cooking .bubble:nth-child(5) {
        margin-top: 2.7vmin; left: 63%; width: 1.1vmin; height: 1.1vmin;
        background-color: #a61e28; 
        animation: bubble 1.6s ease-in-out 1s infinite;
    }

    #cooking #area {
        position: absolute; bottom: 0; right: 0; width: 50%; height: 50%;
        background-color: transparent;
        transform-origin: 15% 60%;
        animation: flip 2.1s ease-in-out infinite;
    }

    #cooking #area #sides {
        position: absolute; width: 100%; height: 100%;
        transform-origin: 15% 60%;
        animation: switchSide 2.1s ease-in-out infinite;
    }

    #cooking #area #sides #handle {
        position: absolute; bottom: 18%; right: 80%; width: 35%; height: 20%;
        background-color: transparent;
        border-top: 1vmin solid #E23744; /* Changed to vmin */
        border-left: 1vmin solid transparent; /* Changed to vmin */
        border-radius: 100%;
        transform: rotate(20deg) rotateX(0deg) scale(1.3, .9);
    }

    #cooking #area #sides #pan {
        position: absolute; bottom: 20%; right: 30%; width: 50%; height: 8%;
        background-color: #E23744; 
        border-radius: 0 0 1.4em 1.4em;
        transform-origin: -15% 0;
    }

    #cooking #area #pancake {
        position: absolute; top: 24%; width: 100%; height: 100%;
        transform: rotateX(85deg);
        animation: jump 2.1s ease-in-out infinite;
    }

    #cooking #area #pancake #pastry {
        position: absolute; bottom: 26%; right: 37%; width: 40%; height: 45%;
        background-color: #ffffff; 
        box-shadow: 0 0 5px 0 rgba(255,255,255,0.5);
        border-radius: 100%;
        transform-origin: -20% 0;
        animation: fly 2.1s ease-in-out infinite;
    }

    /* --- Keyframes --- */
    @keyframes jump {
        0% { top: 24%; transform: rotateX(85deg); }
        25% { top: 10%; transform: rotateX(0deg); }
        50% { top: 30%; transform: rotateX(85deg); }
        75% { transform: rotateX(0deg); }
        100% { transform: rotateX(85deg); }
    }

    @keyframes flip {
        0% { transform: rotate(0deg); }
        5% { transform: rotate(-27deg); }
        30%, 50% { transform: rotate(0deg); }
        55% { transform: rotate(27deg); }
        83.3% { transform: rotate(0deg); }
        100% { transform: rotate(0deg); }
    }

    @keyframes switchSide {
        0% { transform: rotateY(0deg); }
        50% { transform: rotateY(180deg); }
        100% { transform: rotateY(0deg); }
    }

    @keyframes fly {
        0% { bottom: 26%; transform: rotate(0deg); }
        10% { bottom: 40%; }
        50% { bottom: 26%; transform: rotate(-190deg); }
        80% { bottom: 40%; }
        100% { bottom: 26%; transform: rotate(0deg); }
    }

    @keyframes bubble {
        0% { transform: scale(.15, .15); top: 80%; opacity: 0; }
        50% { transform: scale(1.1, 1.1); opacity: 1; }
        100% { transform: scale(.33, .33); top: 60%; opacity: 0; }
    }

    @keyframes pulse {
        0% { transform: scale(1, 1); opacity: .4; }
        50% { transform: scale(1.05, 1); opacity: 1; }
        100% { transform: scale(1, 1); opacity: .4; }
    }
</style>

<div id="global-loader">
    <h1>Cooking in progress..</h1>
    <div id="cooking">

        <div class="bubble"></div>
        <div class="bubble"></div>

        <div class="bubble"></div>
        
        <div id="area">
            <div id="sides">

<script>
    // 1. SILKY FADE OUT ON LOAD
    window.addEventListener('load', function() {
        const loader = document.getElementById('global-loader');
        setTimeout(() => {
            loader.classList.add('hidden');
        }, 150); 
    });

    // 2. BACK BUTTON FIX
    window.addEventListener('pageshow', function(event) {
        if (event.persisted) {
            document.getElementById('global-loader').classList.add('hidden');
        }
    });

    // 3. SMART FADE IN ON CLICK
    document.addEventListener("DOMContentLoaded", function() {
        const links = document.querySelectorAll('a');
        
        links.forEach(link => {
            link.addEventListener('click', function(e) {
                const hrefAttr = this.getAttribute('href');
                const targetAttr = this.getAttribute('target');
                
                if (!hrefAttr || hrefAttr.startsWith('javascript') || targetAttr === '_blank') {
                    return;
                }

                const linkUrl = new URL(this.href, window.location.href);
                const currentUrl = new URL(window.location.href);

                if (linkUrl.pathname === currentUrl.pathname && linkUrl.hash) {
                    return;
                }

                e.preventDefault(); 
                document.getElementById('global-loader').classList.remove('hidden'); 
                
                setTimeout(() => {
                    window.location.href = this.href;
                }, 400); 
            });
        });
    });
</script>
<div class="checkout-container">
    
    <div class="payment-panel">
        <h2>Payment Details</h2>
        
        <form id="payment-form">
            
            <input type="hidden" name="stripeToken" id="stripeToken">

            <div class="form-group">

        </div>

<script>
(function () {
    var checkout = VK.Checkout.get() || {};
    var totalBill = checkout.totalBill || '0.00';

    // Same guards as the original JSP: must be logged in and have something to pay for
    if (!VK.Auth.isLoggedIn()) { window.location.replace('index.html'); return; }
    if (!checkout.totalBill || checkout.totalBill === '0.00') { window.location.replace('order.html'); return; }

    document.getElementById('totalAmount').textContent = totalBill;
    document.getElementById('reservationNote').innerHTML = checkout.tableId
        ? 'Includes reservation for <strong>Table ' + VK.esc(checkout.tableId) + '</strong> on ' + VK.esc(checkout.bookingDate) + ' at ' + VK.esc(checkout.bookingTime) + '.'
        : 'Takeaway order only.';

    var form = document.getElementById('payment-form');
    var submitBtn = document.getElementById('submit-btn');
    submitBtn.innerText = 'Pay $' + totalBill;

    // 1. Stripe (test publishable key - safe to be public)
    var style = {
        base: {
            color: '#ffffff',
            fontFamily: '"Inter", sans-serif',
            fontSmoothing: 'antialiased',
            fontSize: '16px',
            '::placeholder': { color: '#888888' }
        },
        invalid: { color: '#ff4757', iconColor: '#ff4757' }
    };
    var stripe = null, card = null;
    if (typeof Stripe === 'function') {
        try {
            stripe = Stripe('pk_test_51THPTpCeJQpppi3EQjNru3SJeHI2dexCK0Xp9DF6nqT9sjvrAt0NMAfxb6jFmHMoPBnyGRMMOPDBwma9swzTh1F600XQgEpp2i');
            card = stripe.elements().create('card', { style: style });
            card.mount('#card-element');
            card.on('change', function (event) {
                document.getElementById('card-errors').textContent = event.error ? event.error.message : '';
            });
        } catch (e) { stripe = null; card = null; }
    }
    if (!card) {
        document.getElementById('card-element').innerHTML =
            '<span style="color:#888; font-size:14px;">Card form unavailable - demo mode. Just click Pay.</span>';
    }

    // 2. Submit
    form.addEventListener('submit', function (event) {
        event.preventDefault();
        submitBtn.disabled = true;
        submitBtn.innerText = 'Processing...';

        if (!card) { finish('tok_demo_' + Math.random().toString(36).slice(2, 10)); return; }

        stripe.createToken(card).then(function (result) {
            if (result.error) {
                document.getElementById('card-errors').textContent = result.error.message;
                submitBtn.disabled = false;
                submitBtn.innerText = 'Pay $' + totalBill;
            } else {
                finish(result.token.id);
            }
        });
    });

    // 3. Save the order in this browser and show the receipt (replaces CompleteOrderServlet)
    function finish(tokenId) {
        VK.Orders.add({
            fullname: VK.Auth.user(),
            tableId: checkout.tableId,
            bookingDate: checkout.bookingDate,
            bookingTime: checkout.bookingTime,
            totalBill: totalBill,
            cartData: checkout.cartData
        });
        var when = new Date().toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true }).toUpperCase();
        VK.Checkout.setReceipt({
            orderId: 'ORD-' + Math.floor(Math.random() * 1000000),
            dateTime: when,
            paymentToken: tokenId,
            cartData: checkout.cartData,
            tableId: checkout.tableId,
            bookingDate: checkout.bookingDate,
            bookingTime: checkout.bookingTime,
            totalBill: totalBill
        });
        VK.Checkout.clear();
        window.location.href = 'success.html';
    }
})();
</script>
